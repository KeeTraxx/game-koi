name: Docs to GitHub Pages

# Builds the Astro/Starlight site in docs/ and publishes it to GitHub Pages, alongside
# (not instead of) readthedocs.com. The build is the same `npm ci && npm run build` that
# .readthedocs.yaml runs; only the canonical URL differs.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions". The workflow's
# GITHUB_TOKEN cannot enable Pages itself, so until then the deploy job fails with 404.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Unlike CI, never cancel a deploy in flight — a half-finished one can leave Pages
# pointing at nothing. Queue the next one behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reports the URL Pages will serve the site from — https://<owner>.github.io/<repo>
      # for a project site, or the custom domain if one is configured — so the base path
      # is never hard-coded here.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      # A project site is served under /<repo>/, so without this every asset and
      # internal link points at the server root and 404s — silently, since the build
      # itself passes. astro.config.mjs derives `site` and `base` from this variable.
      - name: Build
        working-directory: docs
        env:
          DOCS_CANONICAL_URL: ${{ steps.pages.outputs.base_url }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
